# Prometheus Configuration for VaruNet Monitoring
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "varunet-backend-internal"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000", "backend.railway.internal:8000"]
        labels:
          application: "varunet"
          service: "fastapi-backend"

  - job_name: "varunet-backend-public"
    metrics_path: "/metrics"
    scheme: https
    static_configs:
      - targets: ["backend-production-538ef.up.railway.app:443"]
        labels:
          application: "varunet"
          service: "fastapi-backend"
